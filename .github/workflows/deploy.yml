name: Sync to Hugging Face Hub
on:
  push:
    branches: [feat/WhaleAlerts] # Chạy khi bạn push vào nhánh main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true # Nếu bạn có file lớn

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN is empty! Please check your GitHub Repository Secrets."
            exit 1
          fi
          
          # Cấu hình Git
          git config --global user.email "KimNhuong@gmail.com"
          git config --global user.name "Kim Nhuong"
          
          # Chỉ xóa các file ảnh nhị phân (.png) trong thư mục docs khỏi commit hiện tại để tránh lỗi trên Hugging Face
          git rm -f docs/*.png || true
          git commit -m "Remove binary files for HF deployment" || true
          
          # Thêm remote HF và push
          # Thay 'username/space-name' đúng với cái bạn tạo trên HF
          git push --force https://DK123bk:$HF_TOKEN@huggingface.co/spaces/DK123bk/DockerSpark HEAD:main